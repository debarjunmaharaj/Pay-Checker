name: pay_checker
description: "Automatic payment verification system for bKash, Nagad, Rocket, Upay and other providers."
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  # Networking & API
  http: ^1.2.0
  connectivity_plus: ^5.0.2

  # Data & Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0
  path: ^1.8.3

  # System & Device
  device_info_plus: ^9.1.2
  permission_handler: ^11.2.0

  # Notifications & Background Tasks
  flutter_local_notifications: ^17.0.0
  workmanager: ^0.10.0

  # State Management & Helpers
  provider: ^6.1.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
